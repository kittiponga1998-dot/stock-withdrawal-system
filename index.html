<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบเบิกจ่ายพัสดุ</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: #f3f4f6;
  color: #222;
}

.header {
  background: #166534;
  color: white;
  text-align: center;
  padding: 22px 15px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.header p {
  margin: 8px 0 0;
}

.container {
  width: 94%;
  max-width: 650px;
  margin: 20px auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 18px;
  margin-bottom: 12px;
  background: white;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.scan-btn {
  background: #2563eb;
  color: white;
}

.stop-btn {
  background: #6b7280;
  color: white;
}

.flash-btn {
  background: #f59e0b;
  color: white;
}

.withdraw-btn {
  background: #dc2626;
  color: white;
}

.receive-btn {
  background: #16a34a;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 15px;
  border-radius: 15px;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  object-fit: cover;
}

.status {
  text-align: center;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.scanning {
  background: #eff6ff;
  color: #1d4ed8;
}

.stock {
  background: #f0fdf4;
  border-left: 5px solid #16a34a;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
  font-size: 18px;
}

.hidden {
  display: none !important;
}

.history {
  border-top: 1px solid #eee;
  margin-top: 15px;
}

.history-item {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
  font-size: 15px;
}

@media(max-width:600px) {

  .header h1 {
    font-size: 25px;
  }

  input,
  select,
  button {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>📦 ระบบเบิกจ่ายพัสดุ ฟาร์มไทรทอง </h1>
  <p>สแกนบาร์โค้ดเพื่อรับเข้าและเบิกจ่าย</p>
</div>

<div class="container">

  <!-- SCANNER -->
  <div class="card">

    <label>บาร์โค้ดสินค้า</label>

    <input
      id="barcode"
      type="text"
      placeholder="สแกนหรือกรอกบาร์โค้ด"
      autocomplete="off"
    >

    <button
      class="scan-btn"
      onclick="startScanner()">
      📷 เปิดกล้องหลังเพื่อสแกน
    </button>

    <div id="reader" class="hidden"></div>

    <button
      id="flashButton"
      class="flash-btn hidden"
      onclick="toggleFlash()">
      🔦 เปิดไฟฉาย
    </button>

    <button
      id="stopButton"
      class="stop-btn hidden"
      onclick="stopScanner()">
      ⛔ ปิดกล้อง
    </button>

    <div id="scanStatus"></div>

  </div>


  <!-- PRODUCT -->
  <div class="card">

    <label>ชื่อสินค้า</label>

    <input
      id="productName"
      type="text"
      placeholder="เช่น ยาสระผม / สบู่"
      readonly
    >

    <label>จำนวน</label>

    <input
      id="quantity"
      type="number"
      value="1"
      min="1"
      inputmode="numeric"
    >

    <div class="stock">
      📦 สต๊อกคงเหลือ:
      <strong id="currentStock">0</strong>
      <span id="stockUnit">หน่วย</span>
    </div>

    
        <div class="form-group">
          <label for="withdrawer">👤 ผู้เบิก</label>
          <select id="withdrawer">
            <option value="">-- เลือกผู้เบิก --</option>
              <option value="พงษ์พัฒน์">พงษ์พัฒน์</option>
              <option value="กิตติพงศ์">กิตติพงศ์</option>
              <option value="วรนุช">วรนุช</option>
              <option value="กฤตนัย">กฤตนัย</option>
              <option value="ปรีชา บัว">ปรีชา บัว</option>
              <option value="นกเล็ก">นกเล็ก</option>
              <option value="สมหมาย">สมหมาย</option>
              <option value="วาสนา">วาสนา</option>
              <option value="สมใจ">สมใจ</option>
              <option value="สมบัติ">สมบัติ</option>
              <option value="รุ่งอรุณ">รุ่งอรุณ</option>
              <option value="ปรีชา กลิ่น">ปรีชา กลิ่น</option>
              <option value="ลำจวน">ลำจวน</option>
              <option value="ศรีสุดา">ศรีสุดา</option>
              <option value="ปิยพัชร์">ปิยพัชร์</option>
              <option value="นิตยา">นิตยา</option>
              <option value="มีนา">มีนา</option>
              <option value="สหชัย">สหชัย</option>
              <option value="ลินดา">ลินดา</option>
              <option value="สุวิทย์">สุวิทย์</option>
              <option value="จารุภัทร">จารุภัทร</option>
              <option value="พีรพัฒน์">พีรพัฒน์</option>
              <option value="สกุณา">สกุณา</option>
              <option value="สรณ์สิริ">สรณ์สิริ</option>
          </select>
        </div>

        <div class="form-group">
          <label for="note">📝 หมายเหตุ <span style="font-weight:normal;">(ไม่บังคับ)</span></label>
          <input id="note" type="text" placeholder="เช่น ใช้ทำความสะอาด">
        </div>

        <button
      class="withdraw-btn"
      onclick="saveTransaction('withdraw')">
      ➖ เบิกจ่าย
    </button>

    <button
      class="receive-btn"
      onclick="saveTransaction('receive')">
      ➕ รับเข้า
    </button>

    <div id="message"></div>

  </div>


  <!-- HISTORY -->
  <div class="card">

    <h2>📋 รายการล่าสุด</h2>

    <div id="history" class="history">
      ยังไม่มีรายการ
    </div>

  </div>

</div>


<script>

/* =========================================
   ตัวแปร
========================================= */

let scanner = null;
let scannerRunning = false;
let cameraTrack = null;
let flashOn = false;


/* =========================================
   เปิดกล้องหลัง
========================================= */

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  const reader =
    document.getElementById("reader");

  const status =
    document.getElementById("scanStatus");

  reader.classList.remove("hidden");

  document
    .getElementById("stopButton")
    .classList.remove("hidden");

  status.className = "status scanning";

  status.innerText =
    "📷 กำลังเปิดกล้องหลัง...";

  scanner =
    new Html5Qrcode("reader");


  try {

    /*
     * ขอใช้กล้องหลังโดยตรง
     */
    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: function(width, height) {

          /*
           * กรอบสแกนแนวนอน
           */
          return {
            width: Math.floor(width * 0.85),
            height: Math.floor(height * 0.35)
          };

        },

        aspectRatio: 1.7777778,

        disableFlip: false
      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning = true;


    status.className =
      "status scanning";

    status.innerText =
      "🔎 กล้องหลังพร้อมใช้งาน — เล็งบาร์โค้ดให้อยู่ในกรอบ";


    /*
     * รอให้กล้องพร้อมก่อน
     * แล้วพยายามเปิด Auto Focus
     */
    setTimeout(
      enableAutoFocus,
      1000
    );


  } catch(error) {

    console.error(error);

    /*
     * บางเครื่องไม่ยอมรับ exact environment
     * จึงลอง environment แบบทั่วไปอีกครั้ง
     */
    try {

      await scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 130
          },

          aspectRatio: 1.7777778,

          disableFlip: false
        },

        onScanSuccess,

        onScanFailure

      );


      scannerRunning = true;

      status.className =
        "status scanning";

      status.innerText =
        "🔎 ใช้กล้องหลัง — เล็งบาร์โค้ดให้อยู่ในกรอบ";


      setTimeout(
        enableAutoFocus,
        1000
      );


    } catch(error2) {

      console.error(error2);

      status.className =
        "status error";

      status.innerText =
        "❌ ไม่สามารถเปิดกล้องหลังได้";

      reader.classList.add("hidden");

      document
        .getElementById("stopButton")
        .classList.add("hidden");

    }

  }

}


/* =========================================
   Auto Focus
========================================= */

async function enableAutoFocus() {

  try {

    const video =
      document.querySelector(
        "#reader video"
      );

    if (!video || !video.srcObject) {
      return;
    }


    const tracks =
      video.srcObject.getVideoTracks();


    if (!tracks.length) {
      return;
    }


    cameraTrack = tracks[0];


    const capabilities =
      cameraTrack.getCapabilities();


    console.log(
      "Camera capabilities:",
      capabilities
    );


    /*
     * Continuous focus
     */
    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      await cameraTrack.applyConstraints({

        advanced: [
          {
            focusMode: "continuous"
          }
        ]

      });

      console.log(
        "Continuous autofocus enabled"
      );

    }


    /*
     * เปิดปุ่มไฟฉาย
     */
    if (capabilities.torch) {

      document
        .getElementById("flashButton")
        .classList.remove("hidden");

    }

  } catch(error) {

    console.log(
      "Auto focus ไม่รองรับ:",
      error
    );

  }

}


/* =========================================
   ไฟฉาย
========================================= */

async function toggleFlash() {

  if (!cameraTrack) {

    return;

  }

  try {

    const capabilities =
      cameraTrack.getCapabilities();


    if (!capabilities.torch) {

      alert(
        "มือถือรุ่นนี้ไม่รองรับไฟฉายผ่านเว็บไซต์"
      );

      return;

    }


    flashOn = !flashOn;


    await cameraTrack.applyConstraints({

      advanced: [
        {
          torch: flashOn
        }
      ]

    });


    document
      .getElementById("flashButton")
      .innerText =
        flashOn
          ? "🔦 ปิดไฟฉาย"
          : "🔦 เปิดไฟฉาย";


  } catch(error) {

    console.error(error);

  }

}


/* =========================================
   สแกนสำเร็จ
========================================= */

function onScanSuccess(decodedText) {

  if (!decodedText) {
    return;
  }


  /*
   * ใส่บาร์โค้ด
   */
  document
    .getElementById("barcode")
    .value =
      decodedText;


  /*
   * สั่น
   */
  if (navigator.vibrate) {

    navigator.vibrate(150);

  }


  /*
   * แสดงผล
   */
  const status =
    document.getElementById(
      "scanStatus"
    );

  status.className =
    "status success";

  status.innerText =
    "✅ สแกนสำเร็จ: " +
    decodedText;


  /*
   * ค้นหาสินค้า
   */
  loadProduct(decodedText);


  /*
   * ปิดกล้อง
   */
  stopScanner();

}


/* =========================================
   Scan Failure
========================================= */

function onScanFailure(error) {

  /*
   * ไม่ต้องแสดงข้อความ
   */

}


/* =========================================
   ปิดกล้อง
========================================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerRunning
    ) {

      await scanner.stop();

      await scanner.clear();

    }

  } catch(error) {

    console.log(error);

  }


  scanner = null;

  scannerRunning = false;

  cameraTrack = null;

  flashOn = false;


  document
    .getElementById("reader")
    .classList.add("hidden");


  document
    .getElementById("stopButton")
    .classList.add("hidden");


  document
    .getElementById("flashButton")
    .classList.add("hidden");

}


/* =========================================
   Google Sheets API
========================================= */
const API_URL =
  "https://script.google.com/macros/s/AKfycbwOWdXuJ-PFTD_mDumKtlXAB-2g6tX29uqqa9uSCZmTCe0sVs4rjAPWMQkg4tdKpoTp-g/exec";

/* =========================================
   โหลดสินค้า
========================================= */
async function loadProduct(barcode) {

  barcode = String(barcode || "").trim();

  if (!barcode) {
    return;
  }

  const productName =
    document.getElementById("productName");

  const currentStock =
    document.getElementById("currentStock");

  const stockUnit =
    document.getElementById("stockUnit");

  productName.value = "กำลังค้นหาสินค้า...";
  currentStock.innerText = "...";
  stockUnit.innerText = "หน่วย";

  try {

    const response = await fetch(
      API_URL +
      "?action=lookup&barcode=" +
      encodeURIComponent(barcode)
    );

    const data = await response.json();

    if (!data.success) {

      productName.value = "";
      currentStock.innerText = "0";
      stockUnit.innerText = "หน่วย";

      showMessage(
        "❌ " + (data.message || "ไม่พบสินค้า"),
        "error"
      );

      return;
    }

    productName.value = data.name || "";
    currentStock.innerText = Number(data.stock) || 0;
    stockUnit.innerText = data.unit || "หน่วย";

    showMessage(
      "✅ พบสินค้า: " + data.name,
      "success"
    );

  } catch (error) {

    console.error(error);

    productName.value = "";
    currentStock.innerText = "0";
    stockUnit.innerText = "หน่วย";

    showMessage(
      "❌ ไม่สามารถเชื่อมต่อ Google Sheets ได้",
      "error"
    );
  }
}

/* =========================================
   รับเข้า / เบิกจ่าย
========================================= */
async function saveTransaction(type) {

  const barcode =
    document.getElementById("barcode").value.trim();

  const quantity =
    parseInt(
      document.getElementById("quantity").value,
      10
    );

  if (!barcode) {

    showMessage(
      "กรุณาสแกนหรือกรอกบาร์โค้ด",
      "error"
    );

    return;
  }

  if (!quantity || quantity <= 0) {

    showMessage(
      "กรุณากรอกจำนวนมากกว่า 0",
      "error"
    );

    return;
  }

  const buttons =
    document.querySelectorAll(
      ".withdraw-btn, .receive-btn"
    );

  buttons.forEach(function(button) {
    button.disabled = true;
  });

  showMessage(
    "⏳ กำลังบันทึกข้อมูล...",
    "success"
  );

  try {

    const action =
      type === "withdraw"
        ? "withdraw"
        : "receive";

    const withdrawer =
      document.getElementById("withdrawer").value.trim();

    const note =
      document.getElementById("note").value.trim();

    if (!withdrawer) {
      showMessage("กรุณาเลือกผู้เบิก", "error");
      return;
    }

    const url =
      API_URL +
      "?action=" +
      encodeURIComponent(action) +
      "&barcode=" +
      encodeURIComponent(barcode) +
      "&quantity=" +
      encodeURIComponent(quantity) +
      "&user=" +
      encodeURIComponent(withdrawer) +
      "&note=" +
      encodeURIComponent(note);

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (!data.success) {

      showMessage(
        "❌ " + (data.message || "บันทึกไม่สำเร็จ"),
        "error"
      );

      return;
    }

    document
      .getElementById("productName")
      .value = data.name || "";

    document
      .getElementById("currentStock")
      .innerText = Number(data.stock) || 0;

    document
      .getElementById("stockUnit")
      .innerText = data.unit || "หน่วย";

    showMessage(
      type === "withdraw"
        ? "✅ เบิกจ่ายสำเร็จ เหลือ " +
          data.stock + " " + data.unit
        : "✅ รับเข้าสำเร็จ มี " +
          data.stock + " " + data.unit,
      "success"
    );

    // ล้างจำนวนและหมายเหตุกลับเป็นค่าเริ่มต้น เพื่อรายการถัดไป
    document.getElementById("quantity").value = 1;
    document.getElementById("note").value = "";

  } catch (error) {

    console.error(error);

    showMessage(
      "❌ ไม่สามารถเชื่อมต่อ Google Sheets ได้",
      "error"
    );

  } finally {

    buttons.forEach(function(button) {
      button.disabled = false;
    });
  }
}

/* =========================================
   แสดงข้อความ
========================================= */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.innerHTML =
    `<div class="status ${type}">
      ${text}
    </div>`;


  setTimeout(
    function() {

      message.innerHTML = "";

    },
    3000
  );

}


/* =========================================
   ประวัติ
========================================= */

function renderHistory() {

  document.getElementById("history").innerHTML =
    '<div class="history-item">รายการทั้งหมดถูกบันทึกใน Google Sheets แล้ว ✅</div>';

}


/* =========================================
   กรอกบาร์โค้ดเอง
========================================= */

const barcodeInput =
  document.getElementById("barcode");

barcodeInput.addEventListener(
  "change",
  function() {
    loadProduct(this.value);
  }
);

barcodeInput.addEventListener(
  "blur",
  function() {
    if (this.value.trim()) {
      loadProduct(this.value);
    }
  }
);

barcodeInput.addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      loadProduct(this.value);
    }
  }
);

renderHistory();

</script>

</body>
</html>
