<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ระบบเบิกจ่ายพัสดุ</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Tahoma", sans-serif;
    background: #f3f4f6;
    color: #222;
}

.header {
    background: #166534;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin: 8px 0 0;
    font-size: 17px;
}

.container {
    width: 94%;
    max-width: 650px;
    margin: 20px auto;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin: 12px 0 8px;
}

input,
select {
    width: 100%;
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 18px;
    background: white;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

.scan-btn {
    background: #2563eb;
    color: white;
}

.withdraw-btn {
    background: #dc2626;
    color: white;
}

.receive-btn {
    background: #16a34a;
    color: white;
}

.camera-btn {
    background: #111827;
    color: white;
}

.stop-btn {
    background: #6b7280;
    color: white;
}

.flash-btn {
    background: #f59e0b;
    color: white;
}

#reader {
    width: 100%;
    margin-top: 15px;
    overflow: hidden;
    border-radius: 15px;
}

#reader video {
    width: 100% !important;
    height: auto !important;
    object-fit: cover;
    border-radius: 15px;
}

#scanStatus {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
    color: #2563eb;
}

.info {
    background: #eff6ff;
    border-left: 5px solid #2563eb;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
}

.stock-box {
    background: #f0fdf4;
    border-left: 5px solid #16a34a;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 18px;
}

.low-stock {
    background: #fef2f2;
    border-left-color: #dc2626;
    color: #b91c1c;
}

.hidden {
    display: none !important;
}

.status {
    text-align: center;
    font-weight: bold;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.history-item {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.history-item:last-child {
    border-bottom: 0;
}

@media (max-width: 600px) {

    .header h1 {
        font-size: 26px;
    }

    .header p {
        font-size: 16px;
    }

    .card {
        padding: 16px;
    }

    input,
    select,
    button {
        font-size: 18px;
        padding: 17px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📦 ระบบเบิกจ่ายพัสดุ</h1>
    <p>สแกนบาร์โค้ดเพื่อรับเข้าและเบิกจ่าย</p>
</div>

<div class="container">

    <!-- SCANNER -->
    <div class="card">

        <label>บาร์โค้ดสินค้า</label>

        <input
            type="text"
            id="barcode"
            placeholder="สแกนหรือกรอกบาร์โค้ด"
            autocomplete="off"
        >

        <button class="scan-btn" onclick="startScanner()">
            📷 สแกนบาร์โค้ด
        </button>

        <div id="reader" class="hidden"></div>

        <div id="scanStatus"></div>

        <button
            id="flashButton"
            class="flash-btn hidden"
            onclick="toggleFlash()">
            🔦 เปิดไฟแฟลช
        </button>

        <button
            id="stopButton"
            class="stop-btn hidden"
            onclick="stopScanner()">
            ⛔ ปิดกล้อง
        </button>

    </div>

    <!-- PRODUCT -->
    <div class="card">

        <label>ชื่อสินค้า</label>

        <input
            type="text"
            id="productName"
            placeholder="เช่น ยาสระผม / สบู่"
        >

        <label>จำนวน</label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1"
            inputmode="numeric"
        >

        <label>ประเภทการทำรายการ</label>

        <select id="transactionType">
            <option value="withdraw">เบิกจ่าย</option>
            <option value="receive">รับเข้า</option>
        </select>

        <div id="stockBox" class="stock-box">
            📦 สต๊อกปัจจุบัน: <span id="currentStock">0</span>
        </div>

        <button
            class="withdraw-btn"
            onclick="saveTransaction('withdraw')">
            ➖ บันทึกเบิกจ่าย
        </button>

        <button
            class="receive-btn"
            onclick="saveTransaction('receive')">
            ➕ บันทึกรับเข้า
        </button>

        <div id="message"></div>

    </div>

    <!-- HISTORY -->
    <div class="card">

        <h2>📋 รายการล่าสุด</h2>

        <div id="history">
            ยังไม่มีรายการ
        </div>

        <button
            class="camera-btn"
            onclick="clearHistory()">
            🗑 ล้างรายการในเครื่อง
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbweQinwbffiLHNYoA4ZASE6a0EtgBFXXSK60q41RaB2XuOLkNjKhDtfjxWlLRWmiaa6/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let scanner = null;
let scannerRunning = false;
let cameraTrack = null;
let flashOn = false;

let stockData =
    JSON.parse(localStorage.getItem("stockData") || "{}");

let historyData =
    JSON.parse(localStorage.getItem("historyData") || "[]");


/* =========================================================
   START SCANNER
   ========================================================= */

async function startScanner() {

    if (scannerRunning) return;

    document.getElementById("reader")
        .classList.remove("hidden");

    document.getElementById("stopButton")
        .classList.remove("hidden");

    document.getElementById("scanStatus").innerText =
        "📷 กำลังเปิดกล้อง...";

    scanner = new Html5Qrcode("reader");

    try {

        const cameras =
            await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {

            throw new Error("ไม่พบกล้อง");

        }

        let cameraId = cameras[0].id;

        /*
         * เลือกกล้องหลัง
         */
        const backCamera =
            cameras.find(camera =>
                /back|rear|environment/i.test(
                    camera.label || ""
                )
            );

        if (backCamera) {
            cameraId = backCamera.id;
        }

        await scanner.start(

            cameraId,

            {
                fps: 10,

                qrbox: function(viewfinderWidth, viewfinderHeight) {

                    let size =
                        Math.min(
                            viewfinderWidth,
                            viewfinderHeight
                        ) * 0.75;

                    return {
                        width: Math.floor(size),
                        height: Math.floor(size * 0.45)
                    };
                },

                aspectRatio: 1.7777778,

                disableFlip: false

            },

            onScanSuccess,

            onScanFailure

        );

        scannerRunning = true;

        document.getElementById("scanStatus").innerText =
            "🔎 เล็งบาร์โค้ดให้อยู่ในกรอบ";

        /*
         * หา video track
         */
        setTimeout(enableContinuousFocus, 1000);

    } catch (error) {

        console.error(error);

        document.getElementById("scanStatus").innerText =
            "❌ เปิดกล้องไม่ได้: " + error.message;

        document.getElementById("reader")
            .classList.add("hidden");

        document.getElementById("stopButton")
            .classList.add("hidden");

    }
}


/* =========================================================
   CONTINUOUS AUTO FOCUS
   ========================================================= */

async function enableContinuousFocus() {

    try {

        const video =
            document.querySelector("#reader video");

        if (!video || !video.srcObject) {
            return;
        }

        const tracks =
            video.srcObject.getVideoTracks();

        if (!tracks || tracks.length === 0) {
            return;
        }

        cameraTrack = tracks[0];

        const capabilities =
            cameraTrack.getCapabilities();

        console.log(
            "Camera capabilities:",
            capabilities
        );

        /*
         * เปิด continuous focus
         */
        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes("continuous")
        ) {

            await cameraTrack.applyConstraints({

                advanced: [
                    {
                        focusMode: "continuous"
                    }
                ]

            });

            console.log("Continuous focus enabled");

        }

        /*
         * เปิด torch button เมื่อมือถือรองรับ
         */
        if (capabilities.torch) {

            document.getElementById("flashButton")
                .classList.remove("hidden");

        }

    } catch (error) {

        console.log(
            "ไม่สามารถตั้งค่า autofocus:",
            error
        );

    }
}


/* =========================================================
   TOGGLE FLASH
   ========================================================= */

async function toggleFlash() {

    if (!cameraTrack) {
        return;
    }

    try {

        const capabilities =
            cameraTrack.getCapabilities();

        if (!capabilities.torch) {

            alert("มือถือรุ่นนี้ไม่รองรับไฟแฟลชผ่านเว็บ");

            return;
        }

        flashOn = !flashOn;

        await cameraTrack.applyConstraints({

            advanced: [
                {
                    torch: flashOn
                }
            ]

        });

        document.getElementById("flashButton").innerText =
            flashOn
                ? "🔦 ปิดไฟแฟลช"
                : "🔦 เปิดไฟแฟลช";

    } catch (error) {

        console.error(error);

    }
}


/* =========================================================
   SCAN SUCCESS
   ========================================================= */

function onScanSuccess(decodedText) {

    if (!decodedText) return;

    document.getElementById("barcode").value =
        decodedText;

    document.getElementById("scanStatus").innerText =
        "✅ สแกนสำเร็จ: " + decodedText;

    /*
     * สั่นมือถือ
     */
    if (navigator.vibrate) {
        navigator.vibrate(150);
    }

    /*
     * โหลดข้อมูลสินค้า
     */
    loadProduct(decodedText);

    /*
     * หยุดกล้องหลังสแกนสำเร็จ
     */
    stopScanner();

}


/* =========================================================
   SCAN FAILURE
   ========================================================= */

function onScanFailure(error) {

    /*
     * ไม่ต้องแสดง error
     * เพราะ callback นี้ถูกเรียกตลอดเวลาที่
     * กล้องยังอ่านบาร์โค้ดไม่ได้
     */

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

async function stopScanner() {

    try {

        if (scanner && scannerRunning) {

            await scanner.stop();

            await scanner.clear();

        }

    } catch (error) {

        console.log(error);

    }

    scanner = null;
    scannerRunning = false;
    cameraTrack = null;
    flashOn = false;

    document.getElementById("reader")
        .classList.add("hidden");

    document.getElementById("stopButton")
        .classList.add("hidden");

    document.getElementById("flashButton")
        .classList.add("hidden");

}


/* =========================================================
   LOAD PRODUCT
   ========================================================= */

function loadProduct(barcode) {

    if (!barcode) return;

    const item = stockData[barcode];

    if (item) {

        document.getElementById("productName").value =
            item.name || "";

        document.getElementById("currentStock").innerText =
            item.stock || 0;

    } else {

        document.getElementById("productName").value =
            "";

        document.getElementById("currentStock").innerText =
            "0";

    }

}


/* =========================================================
   SAVE TRANSACTION
   ========================================================= */

async function saveTransaction(type) {

    const barcode =
        document.getElementById("barcode").value.trim();

    const name =
        document.getElementById("productName").value.trim();

    const quantity =
        parseInt(
            document.getElementById("quantity").value
        );

    if (!barcode) {

        showMessage(
            "กรุณาสแกนหรือกรอกบาร์โค้ด",
            "error"
        );

        return;
    }

    if (!name) {

        showMessage(
            "กรุณากรอกชื่อสินค้า",
            "error"
        );

        return;
    }

    if (!quantity || quantity <= 0) {

        showMessage(
            "กรุณาระบุจำนวน",
            "error"
        );

        return;
    }


    /*
     * สร้างสินค้าใหม่
     */
    if (!stockData[barcode]) {

        stockData[barcode] = {

            name: name,
            stock: 0

        };

    }


    /*
     * รับเข้า
     */
    if (type === "receive") {

        stockData[barcode].stock += quantity;

    }


    /*
     * เบิกจ่าย
     */
    if (type === "withdraw") {

        if (
            stockData[barcode].stock < quantity
        ) {

            showMessage(
                "❌ สต๊อกไม่เพียงพอ",
                "error"
            );

            return;

        }

        stockData[barcode].stock -= quantity;

    }


    /*
     * บันทึกข้อมูลในเครื่อง
     */
    localStorage.setItem(
        "stockData",
        JSON.stringify(stockData)
    );


    /*
     * ประวัติ
     */
    const transaction = {

        barcode: barcode,

        name: name,

        quantity: quantity,

        type: type,

        stock:
            stockData[barcode].stock,

        datetime:
            new Date().toLocaleString(
                "th-TH"
            )

    };


    historyData.unshift(transaction);

    /*
     * เก็บ 50 รายการล่าสุด
     */
    historyData =
        historyData.slice(0, 50);

    localStorage.setItem(
        "historyData",
        JSON.stringify(historyData)
    );


    /*
     * แสดงผล
     */
    document.getElementById("currentStock").innerText =
        stockData[barcode].stock;


    showMessage(
        type === "receive"
            ? "✅ รับเข้าสำเร็จ"
            : "✅ เบิกจ่ายสำเร็จ",
        "success"
    );


    renderHistory();


    /*
     * ส่งข้อมูลไป Google Apps Script
     */
    sendToGoogleSheet(transaction);

}


/* =========================================================
   SEND TO GOOGLE SHEET
   ========================================================= */

async function sendToGoogleSheet(data) {

    try {

        await fetch(
            GAS_URL,
            {

                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body: JSON.stringify(data)

            }
        );

        console.log(
            "ส่งข้อมูลไป Google Sheet แล้ว"
        );

    } catch (error) {

        console.log(
            "ไม่สามารถส่งข้อมูลไป Google Sheet:",
            error
        );

    }

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.innerHTML =
        `<div class="status ${type}">
            ${text}
        </div>`;

    setTimeout(() => {

        message.innerHTML = "";

    }, 3500);

}


/* =========================================================
   HISTORY
   ========================================================= */

function renderHistory() {

    const history =
        document.getElementById("history");

    if (!historyData.length) {

        history.innerHTML =
            "ยังไม่มีรายการ";

        return;

    }

    history.innerHTML =
        historyData
            .slice(0, 10)
            .map(item => {

                const icon =
                    item.type === "receive"
                        ? "➕"
                        : "➖";

                const typeText =
                    item.type === "receive"
                        ? "รับเข้า"
                        : "เบิกจ่าย";

                return `
                    <div class="history-item">

                        <b>
                            ${icon} ${typeText}
                        </b>

                        <br>

                        📦 ${item.name}

                        <br>

                        🔢 บาร์โค้ด:
                        ${item.barcode}

                        <br>

                        จำนวน:
                        ${item.quantity}

                        <br>

                        คงเหลือ:
                        ${item.stock}

                        <br>

                        🕐 ${item.datetime}

                    </div>
                `;

            })
            .join("");

}


/* =========================================================
   CLEAR HISTORY
   ========================================================= */

function clearHistory() {

    if (
        !confirm(
            "ต้องการล้างรายการในเครื่องทั้งหมดหรือไม่?"
        )
    ) {

        return;

    }

    historyData = [];

    localStorage.removeItem(
        "historyData"
    );

    renderHistory();

}


/* =========================================================
   BARCODE INPUT
   ========================================================= */

document
    .getElementById("barcode")
    .addEventListener(
        "change",
        function() {

            loadProduct(this.value.trim());

        }
    );


/* =========================================================
   INITIAL
   ========================================================= */

renderHistory();

</script>

</body>
</html>
