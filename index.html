<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ระบบเบิกจ่ายพัสดุ</title>

  <!-- ระบบอ่านบาร์โค้ดจากกล้อง -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .header {
      background: #166534;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 18px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input,
    select {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .scan-btn {
      background: #2563eb;
      color: white;
    }

    .withdraw-btn {
      background: #dc2626;
      color: white;
    }

    .receive-btn {
      background: #16a34a;
      color: white;
    }

    .close-btn {
      background: #555;
      color: white;
    }

    #scanner {
      width: 100%;
      margin-top: 15px;
      display: none;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #86efac;
      display: none;
      font-size: 18px;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 26px;
      }

      .header p {
        font-size: 17px;
      }

      label {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📦 ระบบเบิกจ่ายพัสดุ</h1>
    <p>สแกนบาร์โค้ดเพื่อรับเข้าและเบิกจ่าย</p>
  </div>

  <div class="container">

    <!-- ส่วนสแกน -->
    <div class="card">

      <label>บาร์โค้ดสินค้า</label>

      <input
        type="text"
        id="barcode"
        placeholder="สแกนหรือกรอกบาร์โค้ด"
      >

      <button class="scan-btn" onclick="startScanner()">
        📷 สแกนบาร์โค้ด
      </button>

      <div id="scanner"></div>

      <button
        id="closeScannerBtn"
        class="close-btn"
        onclick="stopScanner()"
        style="display:none;"
      >
        ✖ ปิดกล้อง
      </button>

      <div id="scanResult" class="result"></div>

    </div>

    <!-- ข้อมูลสินค้า -->
    <div class="card">

      <label>ชื่อสินค้า</label>

      <input
        type="text"
        id="productName"
        placeholder="เช่น ยาสระผม / สบู่"
      >

      <label>จำนวน</label>

      <input
        type="number"
        id="quantity"
        value="1"
        min="1"
      >

      <label>ประเภทการทำรายการ</label>

      <select id="transactionType">
        <option value="withdraw">เบิกจ่าย</option>
        <option value="receive">รับเข้า</option>
      </select>

      <button
        class="withdraw-btn"
        onclick="withdrawStock()"
      >
        ➖ บันทึกเบิกจ่าย
      </button>

      <button
        class="receive-btn"
        onclick="receiveStock()"
      >
        ➕ บันทึกรับเข้า
      </button>

      <div id="status" class="status"></div>

    </div>

  </div>

<script>

  let scanner = null;

  // ==============================
  // เปิดกล้อง
  // ==============================

  function startScanner() {

    const scannerElement = document.getElementById("scanner");
    const closeButton = document.getElementById("closeScannerBtn");

    scannerElement.style.display = "block";
    closeButton.style.display = "block";

    scanner = new Html5Qrcode("scanner");

    const config = {
      fps: 10,
      qrbox: {
        width: 280,
        height: 150
      }
    };

    scanner.start(
      {
        facingMode: "environment"
      },
      config,
      onScanSuccess,
      onScanFailure
    ).catch(function(error) {

      alert(
        "ไม่สามารถเปิดกล้องได้\n\n" +
        "กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง"
      );

      console.log(error);

      stopScanner();

    });

  }


  // ==============================
  // เมื่ออ่านบาร์โค้ดสำเร็จ
  // ==============================

  function onScanSuccess(decodedText) {

    document.getElementById("barcode").value = decodedText;

    document.getElementById("scanResult").style.display = "block";

    document.getElementById("scanResult").innerHTML =
      "✅ อ่านบาร์โค้ดสำเร็จ<br>" +
      "<strong>" + decodedText + "</strong>";

    // ปิดกล้องหลังจากสแกนสำเร็จ
    stopScanner();

  }


  // ==============================
  // ระหว่างสแกน
  // ==============================

  function onScanFailure(error) {
    // ไม่ต้องแสดงข้อความ เพราะจะเกิดขึ้นตลอดเวลาที่กล้องกำลังค้นหาบาร์โค้ด
  }


  // ==============================
  // ปิดกล้อง
  // ==============================

  function stopScanner() {

    const scannerElement = document.getElementById("scanner");
    const closeButton = document.getElementById("closeScannerBtn");

    if (scanner) {

      scanner.stop()
        .then(function() {

          scanner.clear();
          scanner = null;

        })
        .catch(function(error) {

          console.log(error);
          scanner = null;

        });

    }

    scannerElement.style.display = "none";
    closeButton.style.display = "none";

  }


  // ==============================
  // เบิกจ่าย
  // ==============================

  function withdrawStock() {

    const barcode = document.getElementById("barcode").value;
    const product = document.getElementById("productName").value;
    const quantity = document.getElementById("quantity").value;

    if (!barcode) {
      alert("กรุณาสแกนหรือกรอกบาร์โค้ดก่อน");
      return;
    }

    if (!product) {
      alert("กรุณากรอกชื่อสินค้า");
      return;
    }

    if (!quantity || quantity <= 0) {
      alert("กรุณากรอกจำนวน");
      return;
    }

    document.getElementById("status").innerHTML =
      "✅ บันทึกเบิกจ่ายเรียบร้อย<br>" +
      "สินค้า: " + product +
      "<br>จำนวน: " + quantity +
      "<br>บาร์โค้ด: " + barcode;

  }


  // ==============================
  // รับเข้า
  // ==============================

  function receiveStock() {

    const barcode = document.getElementById("barcode").value;
    const product = document.getElementById("productName").value;
    const quantity = document.getElementById("quantity").value;

    if (!barcode) {
      alert("กรุณาสแกนหรือกรอกบาร์โค้ดก่อน");
      return;
    }

    if (!product) {
      alert("กรุณากรอกชื่อสินค้า");
      return;
    }

    if (!quantity || quantity <= 0) {
      alert("กรุณากรอกจำนวน");
      return;
    }

    document.getElementById("status").innerHTML =
      "✅ บันทึกรับเข้าเรียบร้อย<br>" +
      "สินค้า: " + product +
      "<br>จำนวน: " + quantity +
      "<br>บาร์โค้ด: " + barcode;

  }

</script>

</body>
</html>
